name: Release PDFs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true

permissions:
  contents: write

jobs:
  pdf:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install PDF toolchain
        run: brew install poppler tectonic
      - name: Build and verify projections
        run: make all
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" _build/pdf/*.pdf _build/pdf/SHA256SUMS --clobber
