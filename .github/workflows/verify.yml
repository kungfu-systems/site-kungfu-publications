name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  buildchain-source:
    uses: kungfu-systems/buildchain/.github/workflows/public-build-check.yml@v4-alpha
    with:
      buildchain-ref: v4-alpha
      mode: verify

  source:
    if: always()
    needs: buildchain-source
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful Buildchain source verification
        env:
          BUILDCHAIN_RESULT: ${{ needs.buildchain-source.result }}
        run: test "$BUILDCHAIN_RESULT" = success

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Verify DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git show -s --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "Missing DCO sign-off: $commit"
              failed=1
            fi
          done
          exit "$failed"
